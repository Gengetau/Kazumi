      if (parseSyncPlayEndPoint(endPoint) == null) {
        setState(() => _customEndPointError = '地址格式为 host:port');
        return;
      }
    }
    await GStorage.putSetting<String>(SettingsKeys.syncPlayEndPoint, endPoint);
    if (!mounted) {
