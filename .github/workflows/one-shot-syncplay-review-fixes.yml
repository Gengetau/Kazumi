name: One-shot SyncPlay review fixes

on:
  push:
    branches:
      - feat/syncplay-chat-room
    paths:
      - .github/workflows/one-shot-syncplay-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/syncplay-chat-room
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Apply reviewed fixes
        run: python .github/scripts/one_shot_syncplay_review_fixes.py

      - name: Format changed Dart files
        run: >-
          dart format
          lib/pages/video/video_page.dart
          lib/pages/player/controller/player_syncplay_controller.dart
          lib/pages/player/syncplay_sheet.dart
          test/player_syncplay_chat_state_test.dart

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Commit verified fixes
        shell: bash
        run: |
          rm .github/workflows/one-shot-syncplay-review-fixes.yml
          rm .github/scripts/one_shot_syncplay_review_fixes.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(syncplay): address chat room review findings"
          git push origin HEAD:feat/syncplay-chat-room
